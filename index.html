<!-- NHẠC NỀN THIỆP CƯỚI -->
<audio id="wedding-audio" loop>
  <source src="nhac-nen.mp3" type="audio/mpeg">
</audio>

<button id="music-toggle" onclick="toggleMusic()" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; width: 45px; height: 45px; border-radius: 50%; background: #e63946; color: white; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center;">
  🎵
</button>

<script>
  const audio = document.getElementById('wedding-audio');
  const btn = document.getElementById('music-toggle');
  let isPlaying = false;

  function toggleMusic() {
    if (isPlaying) {
      audio.pause();
      btn.innerHTML = '🔇';
    } else {
      audio.play();
      btn.innerHTML = '🎵';
    }
    isPlaying = !isPlaying;
  }

  // Tự động phát nhạc ngay khi khách chạm/click lần đầu vào màn hình
  document.addEventListener('click', function autoPlayOnce() {
    if (!isPlaying) {
      audio.play().then(() => {
        isPlaying = true;
        btn.innerHTML = '🎵';
      }).catch(() => {});
    }
    document.removeEventListener('click', autoPlayOnce);
  });
</script>
